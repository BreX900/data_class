name: example
publish_to: 'none'

environment:
  sdk: ^3.9.0

scripts:
  # To generate .g files:
  generate-code: dart run build_runner watch --delete-conflicting-outputs --verbose

dependencies:
  collection: ^1.16.0
  mek_data_class:
  json_annotation: ^4.12.0

dependency_overrides:
  class_to_string: { path: ../class_to_string }
  mek_data_class: { path: ../mek_data_class }
  mek_data_class_generator: { path: ../mek_data_class_generator }

dev_dependencies:
  mek_lints: ^7.0.0
  test: ^1.21.6

  build_runner: ^2.16.0
  mek_data_class_generator:
  json_serializable: ^6.14.1
